<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="@@DESCRIPTION@@">
<title>@@TITLE@@</title>
<!--DOCPILOT_HEAD-->
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font: 1rem/1.65 var(--font-body);
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, h3, label, button, summary { font-family: var(--font-heading); }
h1, h2, h3 { text-wrap: balance; }
h1 { font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.2; letter-spacing: -.025em; font-weight: 650; }
h2 { font-size: 1.25rem; line-height: 1.4; font-weight: 600; }
h3 { font-size: 1rem; line-height: 1.5; font-weight: 600; }
a { color: var(--ink); text-underline-offset: .2em; }
button { border: 0; color: var(--ink); cursor: pointer; }
input[type="search"] {
  width: 100%;
  min-height: 3rem;
  padding: .65rem .9rem;
  border: 1px solid var(--input-border);
  border-radius: var(--radius-control);
  background: var(--input-bg);
  color: var(--ink);
  font: 1rem/1.5 var(--font-body);
}
input::placeholder { color: var(--secondary); opacity: 1; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button:disabled { cursor: default; opacity: .55; }
[hidden] { display: none !important; }
[data-theme-toggle] {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  min-height: 2.5rem;
  border-radius: var(--radius-button);
  padding: .4rem .7rem;
  background: var(--control-bg);
  font: 550 .8125rem/1.5 var(--font-heading);
}
[data-theme-toggle]::before {
  content: "";
  width: .85rem;
  height: .85rem;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  background: linear-gradient(to right, currentColor 50%, transparent 50%);
}
[data-theme-toggle][aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }
@media (hover: hover) {
  [data-theme-toggle]:hover { background: var(--control-hover); text-decoration: underline; }
  [data-theme-toggle][aria-pressed="true"]:hover { background: var(--accent-fill); }
}

main { max-width: 72rem; margin-inline: auto; padding: 0 clamp(1rem, 5vw, 4rem) 5rem; }
h1, h2, h3, p, ol { margin: 0; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: .8rem; min-height: 4.5rem; border-bottom: 1px solid var(--rule); }
.toolbar [data-theme-toggle] { margin-inline-start: auto; }
.toolbar nav a { font: 550 .875rem/1.5 var(--font-heading); padding-block: .45rem; }
header { margin: clamp(2.2rem, 4vw, 3.5rem) 0 2rem; }
header p { color: var(--secondary); max-width: 72ch; margin-top: .55rem; }
label { display: block; font-weight: 600; margin-bottom: .35rem; }
button, summary { cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0 1.5rem; }
.filters button, .related a, .small {
  display: inline-flex;
  align-items: center;
  min-height: 2.5rem;
  border-radius: var(--radius-button);
  background: var(--control-bg);
  color: var(--ink);
  padding: .35rem .75rem;
  font: 500 .875rem/1.5 var(--font-heading);
  text-decoration: none;
}
.filters [aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); font-weight: 650; }
.scenarios { margin: 1.75rem 0; }
.scenarios h2 { margin-bottom: .5rem; }
.scenario { border-top: 1px solid var(--rule); }
.scenario summary { padding: .65rem .25rem; font-weight: 550; }
.scenario ol { padding: .25rem 0 .6rem 1.5rem; }
.scenario li { padding: .3rem 0; }
.scenario p, .hint, .status { font-size: .875rem; color: var(--secondary); }
.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: .7rem; margin-top: 1.8rem; padding-bottom: .5rem; border-bottom: 1px solid var(--input-border); }
#count { font-variant-numeric: tabular-nums; }
#rows { list-style: none; padding: 0; margin: 0; }
.row { border-bottom: 1px solid var(--rule); }
.row-trigger {
  display: grid;
  align-items: center;
  grid-template-columns: minmax(10rem, .7fr) minmax(0, 1.3fr) auto;
  gap: 1rem;
  width: 100%;
  padding: .85rem .65rem;
  border: 0;
  background: transparent;
  font: inherit;
  text-align: start;
}
.row-trigger code, #detail-title, .related a, .scenario a[data-item] { font-family: var(--font-mono); font-weight: 400; overflow-wrap: anywhere; }
.row-trigger small { color: var(--secondary); font-size: .8125rem; }
.row-trigger[aria-expanded="true"] { background: var(--selected); box-shadow: inset 3px 0 var(--ink); }
#detail { min-width: 0; padding: clamp(1rem, 3vw, 1.5rem); border: 1px solid var(--rule); border-radius: var(--radius-panel); background: var(--paper); }
#detail section, #detail details { margin-top: 1.2rem; }
#detail p, #detail pre, .scenario li { max-inline-size: 72ch; white-space: pre-wrap; }
#detail pre { margin: .5rem 0; padding: .8rem; background: var(--code-bg); border-inline-start: 2px solid var(--input-border); font: .9rem/1.65 var(--font-mono), var(--font-body); overflow-wrap: anywhere; }
#detail summary { cursor: pointer; font-weight: 550; padding-block: .4rem; }
#detail details p, #detail details a { margin-block-start: .5rem; }
.detail-head { display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: .5rem; margin-bottom: .4rem; }
#detail-title { min-width: 0; font-size: clamp(1.15rem, 2vw, 1.5rem); }
.related, .copy-line { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .45rem; }
.status[data-state="success"] { color: var(--success); }
.status[data-state="error"] { color: var(--error); }
#empty { padding: 1.25rem 0; }
@media (hover: hover) {
  .filters button:hover, .related a:hover, .small:hover, .row-trigger:hover, .scenario summary:hover { background: var(--control-hover); }
  .filters [aria-pressed="true"]:hover { background: var(--accent-fill); }
  .related a:hover, .small:hover, .filters button:hover { text-decoration: underline; }
}
@media (min-width: 52rem) {
  .layout.is-open { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 1.5rem; }
  .layout.is-open .row-trigger { grid-template-columns: minmax(0, 1fr) auto; gap: .25rem; }
  .layout.is-open .row-trigger span { grid-column: 1/-1; grid-row: 2; }
  #detail { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; }
}
@media (max-width: 51.99rem) {
  .row-trigger { grid-template-columns: minmax(0, 1fr) auto; gap: .25rem .5rem; }
  .row-trigger span { grid-column: 1/-1; grid-row: 2; }
  #detail { margin: 0 0 .85rem; }
}
@media (max-width: 24rem) {
  .row-trigger { grid-template-columns: minmax(0, 1fr); }
  .row-trigger span { grid-row: auto; }
}
</style>
</head>
<body>
<main>
<div class="toolbar"><nav id="home-nav" aria-label="사전 탐색" hidden><a href="../">사전 목록</a></nav><button type="button" data-theme-toggle aria-label="다크 모드" aria-pressed="false">다크 모드</button></div>
<header><h1>@@TITLE@@@@TITLE_EN@@</h1><p>@@DESCRIPTION@@</p></header>
<label for="query">스킬 검색 <span class="heading-en" lang="en" aria-hidden="true">search skills</span></label>
<div class="search-field">
  <input id="query" name="q" type="search" placeholder="스킬 이름, 작업, 상황으로 검색" autocomplete="off">
  <svg class="search-light" aria-hidden="true" focusable="false">
    <defs><linearGradient id="search-spectrum">
      <stop stop-color="#f25c76"/><stop offset=".18" stop-color="#ff994a"/>
      <stop offset=".34" stop-color="#e9c84b"/><stop offset=".5" stop-color="#46c98e"/>
      <stop offset=".66" stop-color="#46bceb"/><stop offset=".82" stop-color="#7d80ef"/>
      <stop offset="1" stop-color="#cf70e9"/>
    </linearGradient></defs>
    <g class="search-sweep" fill="none" stroke="url(#search-spectrum)" stroke-linecap="round">
      <rect class="sweep-halo" pathLength="100"/>
      <rect class="sweep-tail" pathLength="100"/>
      <rect class="sweep-body" pathLength="100"/>
      <rect class="sweep-tip" pathLength="100"/>
    </g>
  </svg>
</div>
<div class="filters" id="filters" role="group" aria-label="목적별 필터"></div>
<section class="scenarios" id="scenarios" aria-label="사용 시나리오" hidden></section>
<div class="results-head"><h2>스킬 목록 <span class="heading-en" lang="en" aria-hidden="true">skill list</span></h2><span class="hint" id="count" aria-live="polite"></span></div>
<div id="layout" class="layout">
<ul id="rows"></ul><p id="empty" hidden>검색 결과가 없습니다. <button type="button" class="small" id="reset">전체 보기</button></p>
<article id="detail" aria-labelledby="detail-title" hidden></article>
</div>
<noscript>스킬을 검색하고 읽으려면 JavaScript를 켜 주세요.</noscript>
</main>
<script type="application/json" id="catalog">@@DATA@@</script>
<script>
"use strict";
const byId = id => document.getElementById(id);
const data = JSON.parse(byId("catalog").textContent);
const items = new Map(data.items.map(item => [item.id, item]));
const rows = new Map();
const narrow = matchMedia("(max-width:51.99rem)");
const query = byId("query");
const detail = byId("detail");
let category = null;
let selected = null;
let opener = null;
function element(tag, value, parent, className, english) {
  const el = document.createElement(tag);
  if (value != null) el.textContent = value;
  if (english) {
    const translation = document.createElement("span");
    translation.className = "heading-en";
    translation.lang = "en";
    translation.setAttribute("aria-hidden", "true");
    translation.textContent = english;
    el.append(" ", translation);
  }
  if (className) el.className = className;
  if (parent) parent.append(el);
  return el;
}
function button(text, parent, action, style) {
  const btn = element("button", text, parent, style);
  btn.type = "button";
  btn.addEventListener("click", action);
  return btn;
}
function source(label, url, parent) {
  const link = element("a", label, parent);
  link.href = url;
}
function itemLink(id, parent) {
  const link = element("a", items.get(id).name, parent);
  link.href = "#" + encodeURIComponent(id);
  link.dataset.item = id;
  link.addEventListener("click", event => {
    if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    openItem(id, true, true, link);
  });
}
function saveView(id, push) {
  const state = { query: query.value, category, scenario: scenarioLinks.indexOf(opener) };
  const fragment = id ? "#" + encodeURIComponent(id) : "";
  if (push && location.hash !== fragment) {
    try {
      const url = new URL(location.href);
      url.hash = fragment;
      history.pushState(state, "", url.href);
      return;
    } catch {
      location.hash = fragment;
    }
  }
  try { history.replaceState(state, ""); } catch { /* Some standalone file readers only support fragments. */ }
}
function closeItem(focus, update) {
  const previous = rows.get(selected);
  if (previous) previous.trigger.setAttribute("aria-expanded", "false");
  const returnTarget = opener;
  opener = null;
  selected = null;
  detail.hidden = true;
  byId("layout").classList.remove("is-open");
  if (update) saveView(null, true);
  if (focus && previous) {
    const target = returnTarget?.isConnected ? returnTarget : previous.trigger;
    const scenario = target.closest(".scenario");
    if (scenario) scenario.open = true;
    (target.closest("[hidden]") ? query : target).focus();
  }
}
function filter() {
  const term = normalizeSearch(query.value);
  const ranked = [];
  for (const row of rows.values()) {
    const score = searchScore(row.item, term);
    row.li.hidden = score < 0 || Boolean(category && row.item.category !== category);
    ranked.push({ row, score });
  }
  const list = byId("rows");
  ranked.sort((a, b) => b.score - a.score).forEach(({ row }, position) => {
    if (list.children[position] !== row.li) list.insertBefore(row.li, list.children[position]);
  });
  const count = ranked.filter(({ row }) => !row.li.hidden).length;
  for (const chip of byId("filters").children) chip.setAttribute("aria-pressed", String((chip.dataset.category ?? null) === category));
  byId("count").textContent = count + "개";
  byId("empty").hidden = count !== 0;
}
function filterFromInput() {
  filter();
  if (selected && rows.get(selected).li.hidden) closeItem(false, true);
  else saveView(selected, false);
}
function placeDetail() {
  if (!selected) return;
  const destination = narrow.matches ? rows.get(selected).li : byId("layout");
  if (detail.parentElement !== destination) destination.append(detail);
}
async function copyExample(text, status, trigger) {
  try {
    if (!navigator.clipboard) throw new Error();
    await navigator.clipboard.writeText(text);
  } catch {
    const box = element("textarea", text, document.body);
    box.style.cssText = "position:fixed;left:0;top:0;opacity:0";
    box.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch { copied = false; }
    finally { box.remove(); trigger.focus(); }
    if (!copied) { status.dataset.state = "error"; status.textContent = "예시를 선택해 복사해 주세요."; return; }
  }
  status.dataset.state = "success";
  status.textContent = "복사했습니다.";
}
function openItem(id, focus, update, trigger) {
  const row = rows.get(id);
  if (!row) return;
  if (row.li.hidden) { category = null; query.value = ""; filter(); }
  if (selected) rows.get(selected).trigger.setAttribute("aria-expanded", "false");
  opener = scenarioLinks.includes(trigger) ? trigger : row.trigger;
  selected = id;
  const item = row.item;
  row.trigger.setAttribute("aria-expanded", "true");
  byId("layout").classList.add("is-open");
  detail.replaceChildren();
  const head = element("div", null, detail, "detail-head");
  const title = element("h2", item.name, head);
  title.id = "detail-title";
  title.tabIndex = -1;
  button("닫기", head, () => closeItem(true, true), "small");
  element("p", item.summary, detail);
  function section(label, value, english) {
    if (!value) return;
    const section = element("section", null, detail);
    element("h3", label, section, null, english);
    element("p", value, section);
  }
  section("언제 쓰나요?", item.when, "when to use");
  if (item.example) {
    const example = element("section", null, detail);
    let prompt = item.example;
    if (item.source) {
      const invocation = "/" + item.name + " ";
      const request = prompt.startsWith(invocation) ? prompt.slice(invocation.length) : prompt;
      prompt = `다음 링크에서 ${item.name}의 원문을 읽고, 스킬을 설치하지 않고 이 요청에 적용해 줘. 필요한 파일이나 도구가 없으면 알려줘.\n${item.source}\n\n${request}`;
    }
    element("h3", item.source ? "설치 없이 사용하기" : "이렇게 요청해 보세요", example, null, item.source ? "try without installing" : "example prompt");
    if (item.source) element("p", "프롬프트를 복사해 원문 링크를 열 수 있는 에이전트에 붙여넣으세요.", example);
    element("pre", prompt, example);
    const controls = element("div", null, example, "copy-line");
    const copy = button(item.source ? "프롬프트 복사" : "예시 복사", controls, () => copyExample(prompt, status, copy), "small");
    if (item.source) source(new URL(item.source).hostname === "github.com" ? "GitHub 원문 보기" : "스킬 원문 보기", item.source, controls);
    const status = element("span", "", controls, "status");
    status.setAttribute("role", "status");
    if (item.exampleSource) source("사례 출처", item.exampleSource, example);
    else element("span", "사전에서 작성한 예시", example, "hint");
  }
  section("무엇을 받나요?", item.result, "what you get");
  if (item.comparison || item.related?.length) {
    const sec = element("section", null, detail);
    element("h3", "어느 쪽을 쓸까?", sec, null, "compare skills");
    if (item.comparison) element("p", item.comparison, sec);
    const links = element("div", null, sec, "related");
    for (const id of item.related || []) itemLink(id, links);
  }
  if (item.avoid || (item.source && !item.example)) {
    const more = element("details", null, detail);
    element("summary", "세부 조건", more, null, "details");
    if (item.avoid) element("p", item.avoid, more);
    if (item.source && !item.example) source("스킬 원문 보기", item.source, more);
  }
  detail.hidden = false;
  placeDetail();
  if (update) saveView(id, true);
  if (focus) title.focus();
}
function readFragment() {
  let id;
  try { id = decodeURIComponent(location.hash.slice(1)); } catch { id = null; }
  const state = history.state;
  query.value = state?.query ?? "";
  category = state?.category ?? null;
  filter();
  if (items.has(id)) {
    if (selected !== id) openItem(id, true, false, scenarioLinks[state?.scenario]);
  } else if (selected) closeItem(true, false);
}
function resetFilters() { category = null; query.value = ""; filterFromInput(); }
for (const cat of [null, ...new Set(data.items.map(item => item.category))]) {
  const chip = button(cat || "전체", byId("filters"), () => { category = cat; filterFromInput(); });
  if (cat) chip.dataset.category = cat;
}
for (const item of data.items) {
  const li = element("li", null, byId("rows"), "row");
  const trigger = button(null, li, () => selected === item.id ? closeItem(true, true) : openItem(item.id, true, true), "row-trigger");
  trigger.setAttribute("aria-expanded", "false");
  trigger.setAttribute("aria-controls", "detail");
  element("code", item.name, trigger);
  element("span", item.summary, trigger);
  element("small", item.category, trigger);
  rows.set(item.id, { li, trigger, item });
}
for (const scenario of data.scenarios || []) {
  const sec = byId("scenarios");
  if (sec.hidden) { sec.hidden = false; element("h2", "사용 시나리오", sec, null, "use cases"); }
  const disclosure = element("details", null, sec, "scenario");
  element("summary", scenario.title, disclosure);
  if (scenario.source) source("실제 사례 출처", scenario.source, disclosure);
  else element("p", "사전에서 구성한 흐름", disclosure);
  const steps = element("ol", null, disclosure);
  for (const step of scenario.steps) {
    const li = element("li", null, steps);
    itemLink(step.id, li);
    element("span", " — " + step.note, li);
  }
}
if (data.home === "../" && location.protocol !== "file:") byId("home-nav").hidden = false;
const scenarioLinks = [...byId("scenarios").querySelectorAll("a[data-item]")];
query.addEventListener("input", filterFromInput);
byId("reset").addEventListener("click", () => { resetFilters(); query.focus(); });
document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.isComposing || event.keyCode === 229 || event.target === query) return;
  if (event.key === "Escape" && selected) { event.preventDefault(); closeItem(true, true); }
});
narrow.addEventListener("change", placeDetail);
window.addEventListener("hashchange", readFragment);
readFragment();
</script>
</body>
</html>
