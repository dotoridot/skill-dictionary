<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스킬 사전 | commeng.run</title>
<!--DOCPILOT_HEAD-->
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font: 1rem/1.65 var(--font-body);
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, h3, label, button, summary { font-family: var(--font-heading); }
h1, h2, h3 { text-wrap: balance; }
h1 { font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.2; letter-spacing: -.025em; font-weight: 650; }
h2 { font-size: 1.25rem; line-height: 1.4; font-weight: 600; }
h3 { font-size: 1rem; line-height: 1.5; font-weight: 600; }
a { color: var(--ink); text-underline-offset: .2em; }
button { border: 0; color: var(--ink); cursor: pointer; }
input[type="search"] {
  width: 100%;
  min-height: 3rem;
  padding: .65rem .9rem;
  border: 1px solid var(--input-border);
  border-radius: var(--radius-control);
  background: var(--input-bg);
  color: var(--ink);
  font: 1rem/1.5 var(--font-body);
}
input::placeholder { color: var(--secondary); opacity: 1; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button:disabled { cursor: default; opacity: .55; }
[hidden] { display: none !important; }

main, header, footer { max-width: 60rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 3rem); }
header, footer { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; min-height: 4.5rem; }
header { border-bottom: 1px solid var(--rule); font: 550 .875rem/1.5 var(--font-heading); }
header nav { display: flex; align-items: center; flex-wrap: wrap; gap: .9rem; }
header a { padding-block: .4rem; }
h1 { margin: clamp(2.5rem, 7vw, 5rem) 0 .55rem; }
main p { margin: 0 0 2rem; color: var(--secondary); max-width: 72ch; }
main label { display: block; font-weight: 600; margin-block-end: .35rem; }
h2 { margin: 2.3rem 0 .6rem; }
.field-links { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 2rem; }
.field-links a { padding: .55rem .8rem; background: var(--control-bg); border-radius: var(--radius-button); text-decoration: none; font-size: .875rem; }
.field-links a[aria-current="true"] { background: var(--accent-fill); color: var(--on-accent); }
.field-links a:not([aria-current="true"]):is(:focus-visible, :active) { background: var(--control-hover); }
@media (hover: hover) {
  .field-links a:hover { background: var(--control-hover); }
  .field-links a[aria-current="true"]:hover { background: var(--accent-fill); }
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .field-links a { transition: background-color 140ms ease-out, transform 140ms ease-out; }
  .field-links a:hover { transform: translateY(-1px); }
  .field-links a:active { transform: none; }
}
.fields { display: grid; gap: clamp(2rem, 5vw, 3rem); }
.field-collections {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
  gap: .75rem 1rem;
}
.field { min-width: 0; scroll-margin-top: 1rem; }
.field h3 { margin: 0 0 .65rem; font-size: 1.125rem; }
#count { font-variant-numeric: tabular-nums; }
.collection, .match {
  padding: 1.15rem .5rem;
  color: var(--ink);
  text-decoration: none;
}
.collection {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-content: start;
  align-items: baseline;
  gap: .35rem .75rem;
  padding: 1rem;
  background: var(--paper);
  border-radius: var(--radius-panel);
}
.collection small { grid-column: 1 / -1; }
.match { display: block; border-top: 1px solid var(--rule); }
.match:last-child { border-bottom: 1px solid var(--rule); }
.collection strong { font: 600 1.2rem/1.4 var(--font-heading); }
.collection b { font-size: .875rem; font-weight: 550; white-space: nowrap; font-variant-numeric: tabular-nums; }
.collection small, .match small { display: block; margin-top: .25rem; color: var(--secondary); font-size: .9375rem; }
.match strong { font: 400 1rem/1.5 var(--font-mono); }
footer { margin-top: 3rem; color: var(--secondary); font-size: .8125rem; }
@media (hover: hover) {
  .collection:hover, .match:hover { background: var(--control-hover); }
  .collection:hover strong, .match:hover strong { text-decoration: underline; }
}
@media (max-width: 23rem) {
  header nav { gap: .6rem; }
}
</style>
</head>
<body>
<header><span>commeng.run</span><nav aria-label="사이트 메뉴"><a href="https://github.com/dotoridot/skill-dictionary">GitHub 저장소</a><button type="button" data-theme-toggle aria-label="다크 모드" aria-pressed="false" title="테마 전환">
  <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path class="theme-moon" d="M20.8 13.1A8.8 8.8 0 0 1 10.9 3.2a8.8 8.8 0 1 0 9.9 9.9Z"/>
    <g class="theme-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></g>
  </svg>
</button></nav></header>
<main><h1>스킬 사전 <span class="heading-en" lang="en" aria-hidden="true">skills-dictionary</span></h1><p>하고 싶은 일이나 이름으로 에이전트 스킬을 찾아보세요.</p>
<label for="query">전체 사전 검색 <span class="heading-en" lang="en" aria-hidden="true">search all skills</span></label><div class="search-field">
  <input type="search" id="query" name="q" placeholder="예: 리뷰, 원인 조사, grilling" autocomplete="off">
  <svg class="search-light" aria-hidden="true" focusable="false">
    <defs><linearGradient id="search-spectrum">
      <stop stop-color="#f25c76"/><stop offset=".18" stop-color="#ff994a"/>
      <stop offset=".34" stop-color="#e9c84b"/><stop offset=".5" stop-color="#46c98e"/>
      <stop offset=".66" stop-color="#46bceb"/><stop offset=".82" stop-color="#7d80ef"/>
      <stop offset="1" stop-color="#cf70e9"/>
    </linearGradient></defs>
    <g class="search-sweep" fill="none" stroke="url(#search-spectrum)" stroke-linecap="round">
      <rect class="sweep-halo" pathLength="100"/>
      <rect class="sweep-tail" pathLength="100"/>
      <rect class="sweep-body" pathLength="100"/>
      <rect class="sweep-tip" pathLength="100"/>
    </g>
  </svg>
</div>
<section id="collections"><h2>분야별 사전 <span class="heading-en" lang="en" aria-hidden="true">collections by field</span></h2>
<nav class="field-links" aria-label="사전 분야 선택"><a href="#collections" aria-current="true">전체</a><!--FIELD_LINKS--></nav>
<div class="fields"><!--COLLECTIONS--></div></section>
<section id="results" hidden><h2 aria-live="polite"><span id="count"></span><span class="heading-en" lang="en" aria-hidden="true">search results</span></h2><div id="matches"></div></section></main>
<footer><span>commeng.run / 스킬 사전</span><a href="https://github.com/dotoridot/skill-dictionary#수록-분야와-선정-근거">사전 선정 기준</a></footer>
<script type="application/json" id="data">/*CATALOGS*/</script>
<script>
const catalogs = JSON.parse(document.querySelector('#data').textContent);
const query = document.querySelector('#query');
const fieldLinks = document.querySelector('.field-links');
const fields = [...document.querySelectorAll('.fields > .field')];

function showField() {
  const selected = fields.find(field => '#' + field.id === location.hash);
  for (const field of fields) field.hidden = Boolean(selected && field !== selected);
  for (const link of fieldLinks.querySelectorAll('a')) {
    if (link.hash === (selected ? location.hash : '#collections')) link.setAttribute('aria-current', 'true');
    else link.removeAttribute('aria-current');
  }
}

fieldLinks.addEventListener('click', event => {
  const link = event.target.closest('a');
  if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  if (location.hash !== link.hash) {
    try { history.pushState(null, '', link.hash); } catch { return; }
  }
  event.preventDefault();
  showField();
});
window.addEventListener('hashchange', showField);
window.addEventListener('pageshow', showField);
showField();

function search() {
  const term = normalizeSearch(query.value);
  const results = document.querySelector('#results');
  document.querySelector('#collections').hidden = term.length > 0;
  results.hidden = term.length === 0;
  const matches = document.querySelector('#matches');
  matches.replaceChildren();
  if (!term.length) return;
  const ranked = [];
  for (const group of catalogs) {
    for (const item of group.items) {
      const score = searchScore(item, term, group.title + " " + group.field);
      if (score >= 0) ranked.push({ group, item, score });
    }
  }
  for (const { group, item } of ranked.sort((a, b) => b.score - a.score)) {
    const link = document.createElement('a');
    link.className = 'match';
    link.href = group.id + '/index.html#' + encodeURIComponent(item.id);
    const text = document.createElement('span');
    const name = document.createElement('strong');
    name.textContent = item.name;
    const summary = document.createElement('small');
    summary.textContent = group.title + ' / ' + item.summary;
    text.append(name, summary);
    link.append(text);
    matches.append(link);
  }
  document.querySelector('#count').textContent = matches.childElementCount ? '검색 결과 ' + matches.childElementCount + '개' : '검색 결과가 없습니다. 다른 이름이나 목적으로 찾아보세요.';
}
query.addEventListener('input', search);
window.addEventListener('pageshow', search);
</script>
</body>
</html>
